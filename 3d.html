<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tuning Page</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      background: #121212;
      color: #fff;
      font-family: Poppins, sans-serif;
    }
    .bg {
      background-image: url("images/g7.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      display: flex;
    }
    .sidebar {
      width: 260px;
      background: initial;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      z-index: 3;
    }
    .tune-options {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .tune-option,
    .back-button {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.8rem;
      margin-bottom: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }
    .tune-option:hover,
    .back-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .model-viewer-wrapper {
      position: absolute;
      width: 60%;
      height: 85%;
      bottom: 0;
      left: 50%;
      transform: translateX(-45%);
      z-index: 2;
      pointer-events: auto;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    .material-select,
    .finish-select {
      background: rgba(255, 255, 255, 0.8);
      border: none;
      color: #434343;
      padding: 0.5rem;
      margin-bottom: 0.8rem;
      border-radius: 6px;
      width: 100%;
      font-size: 0.9rem;
    }
    #colorPicker {
      width: 100%;
      margin-bottom: 0.8rem;
      height: 2.5rem;
      border: none;
      cursor: pointer;
    }
    .rim-container {
      position: absolute;
      right: 0;
      top: 0;
      width: 320px;
      height: 100%;
      background: rgba(0,0,0,0.5);
      overflow-y: auto;
      padding: 1rem;
      display: none;
      z-index: 4;
    }
    .rim-container.active {
      display: block;
    }
    .rim-container model-viewer {
      width: 100%;
      height: 200px;
      margin-bottom: 1rem;
      border: 1px solid #333;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="sidebar">
      <div class="tune-options">
        <select id="materialSelect" class="material-select">
          <option value="">Select Part to Paint</option>
          <option value="body">Body</option>
          <option value="rims">Rims</option>
        </select>
        <input type="color" id="colorPicker" />
        <select id="finishSelect" class="finish-select">
          <option value="metallic">Metallic</option>
          <option value="gloss">Gloss</option>
          <option value="matte">Matte</option>
        </select>
        <div class="tune-option" id="applyPaint">🎨 Apply Paint</div>
        <div class="tune-option" id="turboOption">🚀 Turbo</div>
        <div class="tune-option" id="ecuOption">🧠 ECU Tune</div>
        <div class="tune-option" id="exhaustOption">🔊 Exhaust</div>
        <div class="tune-option" id="showRims">🛞 Rims</div>
        <div class="tune-option" id="lightsOption">💡 Lights</div>
      </div>
      <div class="back-button" id="backBtn">⬅ Back</div>
    </div>

    <div class="model-viewer-wrapper">
      <model-viewer id="carModel" src="" alt="Car 3D Model" camera-controls auto-rotate shadow-intensity="1" background-color="#000"></model-viewer>
    </div>

    <div class="rim-container" id="rimsContainer">
      <model-viewer class="rimOption" data-rim-src="rims/equip 5.glb" src="rims/equip 5.glb" camera-controls auto-rotate></model-viewer>
      <model-viewer class="rimOption" data-rim-src="rims/meister.glb" src="rims/meister.glb" camera-controls auto-rotate></model-viewer>
      <model-viewer class="rimOption" data-rim-src="rims/lm.glb" src="rims/lm.glb" camera-controls auto-rotate></model-viewer>
      <model-viewer class="rimOption" data-rim-src="rims/nt03.glb" src="rims/nt03.glb" camera-controls auto-rotate></model-viewer>
      <model-viewer class="rimOption" data-rim-src="rims/vs-xx.glb" src="rims/vs-xx.glb" camera-controls auto-rotate></model-viewer>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('carModel');
    const materialSelect = document.getElementById('materialSelect');
    const colorPicker = document.getElementById('colorPicker');
    const finishSelect = document.getElementById('finishSelect');
    const applyPaint = document.getElementById('applyPaint');
    const backBtn = document.getElementById('backBtn');
    const showRimsBtn = document.getElementById('showRims');
    const rimsContainer = document.getElementById('rimsContainer');
    let unsavedChanges = false;

    const selectedModel = (localStorage.getItem('selectedModel') || 'models/gallardomain.glb').replace(/^\//, '');
    const targetMaterials = JSON.parse(localStorage.getItem('targetMaterials') || '[]');

    if (selectedModel) {
      viewer.setAttribute('src', selectedModel);
    }

    let materialsLoaded = [];

    viewer.addEventListener('load', () => {
      try {
        if (!viewer.model) throw new Error("Model not ready");
        materialsLoaded = viewer.model.materials || [];
      } catch (err) {
        console.error("Model failed to load or materials unavailable:", err);
      }
    });

    applyPaint.addEventListener('click', () => {
      if (!materialsLoaded.length) return alert("Model not ready");
      const part = materialSelect.value;
      const hex = colorPicker.value;
      const finish = finishSelect.value;

      let metallic = 0.9, roughness = 0.2;
      if (finish === "gloss") { metallic = 0.1; roughness = 0.1; }
      else if (finish === "matte") { metallic = 0.0; roughness = 0.8; }

      const partMaterialNames = {
        body: targetMaterials,
        rims: ["wheel", "material_002"]
      };

      let painted = 0;
      materialsLoaded.forEach(mat => {
        if (partMaterialNames[part]?.includes(mat.name)) {
          const rgba = hexToRgba(hex);
          if (mat.pbrMetallicRoughness?.baseColorTexture) {
            mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
          }
          mat.pbrMetallicRoughness?.setBaseColorFactor(rgba);
          mat.pbrMetallicRoughness?.setMetallicFactor(metallic);
          mat.pbrMetallicRoughness?.setRoughnessFactor(roughness);
          painted++;
        }
      });

      alert(painted ? `Painted ${painted} part(s)` : "No matching part found");
    });

    function hexToRgba(hex) {
      const i = parseInt(hex.slice(1), 16);
      return [((i >> 16) & 255) / 255, ((i >> 8) & 255) / 255, (i & 255) / 255, 1];
    }

    document.querySelectorAll("#turboOption, #ecuOption, #exhaustOption, #lightsOption").forEach(el => {
      el.addEventListener("click", () => {
        alert(el.textContent + " Installed!");
        unsavedChanges = true;
      });
    });

    backBtn.addEventListener('click', () => {
      if (unsavedChanges && !confirm("You have unsaved changes. Leave anyway?")) return;
      window.location.href = "car_selection.html";
    });

    showRimsBtn.addEventListener('click', () => {
      rimsContainer.classList.toggle('active');
    });

    document.querySelectorAll(".rimOption").forEach(btn => {
      btn.addEventListener("click", async () => {
        const rimSrc = btn.getAttribute("data-rim-src");
        if (!rimSrc) return alert("Missing rim source");

        const rimViewer = document.createElement('model-viewer');
        rimViewer.setAttribute('src', rimSrc);
        rimViewer.setAttribute('exposure', '1');
        document.body.appendChild(rimViewer);

        rimViewer.addEventListener('load', () => {
          const rimScene = rimViewer.model?.scene;
          const carScene = viewer.model?.scene;

          if (!carScene || !rimScene) {
            alert("Could not load models correctly");
            return;
          }

          // remove old rims
          carScene.children.forEach(child => {
            if (child.name.toLowerCase().includes("rim") || child.name.toLowerCase().includes("wheel")) {
              child.visible = false;
            }
          });

          // add new rims
          rimScene.children.forEach(rim => {
            carScene.add(rim.clone());
          });

          rimViewer.remove();
          alert("Rims replaced!");
        });
      });
    });
  </script>
</body>
</html>
