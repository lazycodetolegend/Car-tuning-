<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tunners2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
<link rel="stylesheet" href="homepage.css"/>
</head>
<body>
<main class="background">
  <!-- Background video (hidden until Start clicked) -->
  <video id="bgVideo">
    <source src="images/background.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <header>
    <h1>Tune Your Favorite Cars</h1>
  </header>
 
  <nav class="profile-wrapper">
    <button class="profile-photo" onclick="toggleSidebar()" aria-label="Open user sidebar">
      <i class="fa fa-user fa-2x"></i>
    </button>
  </nav>

  <div class="cursor"></div>
  
  <section class="button-container">
    <button id="playButton" onclick="startVideoAndRedirect()">
      <img src="images/start.png" alt="start button">
    </button>
  </section>
</main>

<aside>
  <nav id="sidebar" class="sidebar">
    <button class="close-btn" onclick="toggleSidebar()" aria-label="Close sidebar">&times;</button>
    <ul style="list-style:none;padding:0;">
      <li><a href="login.html">Login / Profile</a></li>
      <li><a href="my-builds.html">My Garage Builds</a></li>
      <li><a href="homepage.html">Home</a></li>
      <li><a href="brand_selection.html">Select Brand</a></li>
      <li><a href="car_selection.html">All Cars</a></li>
      <li><a href="rims.html">Rims Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</aside>

<footer>
  &copy; 2025 Tunners. All rights reserved.
</footer>

<script>
   // Custom cursor
   const cursor = document.querySelector('.cursor');
   document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
   });

   function startVideoAndRedirect() {
     const button = document.getElementById("playButton");
     const bgVideo = document.getElementById("bgVideo");

     button.style.display = "none";   // hide start button
     bgVideo.style.display = "block"; // show video
     bgVideo.currentTime = 0;         // restart video

     // Redirect when video ends or when clicked
     bgVideo.onended = function() {
       window.location.href = "brand_selection.html";
     };
     bgVideo.onclick = function() {
       window.location.href = "brand_selection.html";
     };

     const playPromise = bgVideo.play();
     if (playPromise !== undefined) {
       playPromise.catch(error => {
         console.warn("Autoplay with audio blocked, trying muted:", error);
         bgVideo.muted = true;
         bgVideo.play().catch(() => {
           window.location.href = "brand_selection.html";
         });
       });
     }
   }

   function toggleSidebar() {
     document.getElementById('sidebar').classList.toggle('active');
   }
</script>
<script src="js/api.js"></script>
</body>
</html>
