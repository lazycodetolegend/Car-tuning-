<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Model Toggle Demo with Controls</title>
  <style>
    body { margin: 0; overflow: hidden; }
    .toggleButton { 
      position: absolute; 
      left: 10px; 
      z-index: 1; 
      padding: 8px 12px; 
      background: white; 
      border: 1px solid #ccc; 
      cursor: pointer; 
      margin-bottom: 5px;
    }
    #toggleRim1 { top: 10px; }
    #toggleWheel { top: 50px; }
    #toggleRim3 { top: 90px; }
  </style>
</head>
<body>

<button id="toggleRim1" class="toggleButton">Show Rim 1</button>
<button id="toggleWheel" class="toggleButton">Show Stock Wheel</button>
<button id="toggleRim3" class="toggleButton">Show Rim 3</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script>
  let scene, camera, renderer, controls;
  let carModel;
  let parts = {}; // store references

  const partNames = ["rim_set1", "wheel_set_stock", "rim_set3"];

  init();
  animate();

  function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights
    const light1 = new THREE.DirectionalLight(0xffffff, 0.6);
light1.position.set(5, 10, 5); 
scene.add(light1);

const light2 = new THREE.DirectionalLight(0xffffff, 0.6);
light2.position.set(-5, 10, 5); 
scene.add(light2);
          
const light3 = new THREE.DirectionalLight(0xffffff, 0.6);
light3.position.set(5, 10, -5); 
scene.add(light3);

const light4 = new THREE.DirectionalLight(0xffffff, 0.6);
light4.position.set(-5, 10, -5); 
scene.add(light4);

    // Load model
    const loader = new THREE.GLTFLoader();
    loader.load('models/car_modular.glb', function (gltf) {
      carModel = gltf.scene;
      scene.add(carModel);

      // Grab parts
      partNames.forEach(name => {
        let part = carModel.getObjectByName(name);
        if (part) {
          parts[name] = part;
        } else {
          console.error(`Part "${name}" not found`);
        }
      });

      // By default show only stock wheel
      showOnly("wheel_set_stock");
    });

    // Orbit controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    window.addEventListener('resize', onWindowResize);

    // Button events
    document.getElementById("toggleRim1").addEventListener("click", () => showOnly("rim_set1"));
    document.getElementById("toggleWheel").addEventListener("click", () => showOnly("wheel_set_stock"));
    document.getElementById("toggleRim3").addEventListener("click", () => showOnly("rim_set3"));
  }

  // Utility: Show one part, hide others
  function showOnly(partName) {
    Object.keys(parts).forEach(name => {
      parts[name].visible = (name === partName);
    });
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
</script>

</body>
</html>
