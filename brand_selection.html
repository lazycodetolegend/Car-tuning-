<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Brand - Car Tuning Garage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
  
  <!-- API & Authentication -->
  <style>
    /* Brand Selection Page Styles */
    * {
      cursor: none !important;
    }

    /* Allow cursor on login modal */
    .login-modal,
    .login-modal *,
    .login-modal-content,
    .login-modal-content * {
      cursor: auto !important;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      padding: 2rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 1.2rem;
      opacity: 0.8;
      margin: 0;
    }

    .brands-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .brands-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .brand-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .brand-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .brand-card:hover::before {
      left: 100%;
    }

    .brand-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      transition: all 0.3s ease;
    }

    .brand-card:hover .brand-logo {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.2);
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: #fff;
    }

    .brand-description {
      font-size: 0.9rem;
      opacity: 0.7;
      margin: 0 0 1rem 0;
      line-height: 1.4;
    }

    .brand-stats {
      display: flex;
      justify-content: space-around;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      display: block;
      font-size: 1.2rem;
      font-weight: 600;
      color: #4ecdc4;
    }

    .back-button {
      position: fixed;
      top: 2rem;
      left: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 1rem 1.5rem;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-5px);
    }

    .cursor {
      width: 40px;
      height: 40px;
      background: url('images/flag.png') no-repeat center center;
      background-size: contain;
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1000;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #4ecdc4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Login Modal Styles */
    .login-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      animation: fadeIn 0.3s ease;
      cursor: auto !important;
    }

    .login-modal.show {
      display: flex;
    }

    .login-modal-content {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 450px;
      width: 90%;
      text-align: center;
      animation: slideIn 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      cursor: auto !important;
      position: relative;
    }

    .login-modal h2 {
      color: #333;
      margin: 0 0 1rem 0;
      font-size: 1.8rem;
    }

    .login-modal p {
      color: #666;
      margin: 0 0 2rem 0;
      line-height: 1.5;
    }

    .login-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer !important;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
    }

    .btn-register {
      background: rgba(255, 255, 255, 0.1);
      color: #333;
      border: 2px solid #667eea;
      border-radius: 12px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer !important;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-register:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
    }

    .btn-close-modal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #999;
      cursor: pointer !important;
      transition: all 0.3s ease;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .btn-close-modal:hover {
      color: #333;
      background: rgba(0, 0, 0, 0.1);
      transform: scale(1.1);
    }

    .user-info {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 0.9rem;
      display: none;
      z-index: 100;
    }

    .user-info.show {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Brand-specific colors */
    .brand-bmw .brand-logo { background: linear-gradient(45deg, #0066cc, #003d7a); }
    .brand-audi .brand-logo { background: linear-gradient(45deg, #bb0a30, #8b0000); }
    .brand-mercedes .brand-logo { background: linear-gradient(45deg, #00adef, #0066cc); }
    .brand-toyota .brand-logo { background: linear-gradient(45deg, #eb0a1e, #c41e3a); }
    .brand-nissan .brand-logo { background: linear-gradient(45deg, #c41e3a, #8b0000); }
    .brand-lamborghini .brand-logo { background: linear-gradient(45deg, #ffd700, #ff8c00); }
    .brand-ferrari .brand-logo { background: linear-gradient(45deg, #dc143c, #8b0000); }
    .brand-porsche .brand-logo { background: linear-gradient(45deg, #000000, #333333); }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }
      
      .header p {
        font-size: 1rem;
      }
      
      .brands-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
      }
      
      .brand-card {
        padding: 1.5rem;
      }
      
      .brand-logo {
        width: 60px;
        height: 60px;
        font-size: 2rem;
      }
      
      .brand-name {
        font-size: 1.2rem;
      }
      
      .back-button {
        top: 1rem;
        left: 1rem;
        padding: 0.8rem 1.2rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  
  <a href="homepage.html" class="back-button">
    <i class="fas fa-arrow-left"></i>
    <span>Back to Home</span>
  </a>

  <div class="user-info" id="userInfo">
    <i class="fas fa-user"></i>
    <span id="userName">Welcome, User!</span>
  </div>

  <div class="header">
    <h1>Choose Your Brand</h1>
    <p>Select a brand to explore their amazing car models</p>
  </div>

  <div class="brands-container">
    <div class="brands-grid" id="brandsGrid">
      <!-- Brands will be populated by JavaScript -->
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
  </div>

  <!-- Login Modal -->
  <div class="login-modal" id="loginModal">
    <div class="login-modal-content">
      <button class="btn-close-modal" onclick="closeLoginModal()">&times;</button>
      <h2>Login Required</h2>
      <p>Please log in to your account to select a brand and start tuning cars.</p>
      <div class="login-buttons">
        <a href="login.html" class="btn-login">
          <i class="fas fa-sign-in-alt"></i>
          Login to Account
        </a>
        <button type="button" class="btn-register" onclick="selectBrandDirect(window.pendingBrand || 'lamborghini')" style="cursor: pointer; border: none; font-size: 1rem;">
          <i class="fas fa-arrow-right"></i>
          Continue as Guest
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/brand-selection.js"></script>
  
  <script>
    // Custom cursor movement
    const cursor = document.querySelector('.cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // Brand data with actual car logos
    const brands = [
      {
        id: 'bmw',
        name: 'BMW',
        description: 'Bayerische Motoren Werke - The Ultimate Driving Machine',
        logo: 'images/bmw.jpg',
        models: 2,
        founded: 1916,
        color: 'brand-bmw'
      },
      {
        id: 'audi',
        name: 'Audi',
        description: 'Vorsprung durch Technik - Progress through Technology',
        logo: 'images/audi.jpg',
        models: 2,
        founded: 1909,
        color: 'brand-audi'
      },
      {
        id: 'toyota',
        name: 'Toyota',
        description: 'Let\'s Go Places - Reliability and Innovation',
        logo: 'images/toyota logo.jpg',
        models: 2,
        founded: 1937,
        color: 'brand-toyota'
      },
      {
        id: 'nissan',
        name: 'Nissan',
        description: 'Innovation that Excites - Japanese Engineering',
        logo: 'images/nissan logo.jpg',
        models: 5,
        founded: 1933,
        color: 'brand-nissan'
      },
      {
        id: 'lamborghini',
        name: 'Lamborghini',
        description: 'Expect the Unexpected - Italian Supercars',
        logo: 'images/lamborghini.jpg',
        models: 3,
        founded: 1963,
        color: 'brand-lamborghini'
      },
      {
        id: 'ferrari',
        name: 'Ferrari',
        description: 'Passion for Excellence - Racing Heritage',
        logo: 'images/ferrari logo.png',
        models: 2,
        founded: 1947,
        color: 'brand-ferrari'
      },
      {
        id: 'porsche',
        name: 'Porsche',
        description: 'There is no Substitute - German Precision',
        logo: 'images/logo.png',
        models: 1,
        founded: 1931,
        color: 'brand-porsche'
      },
      {
        id: 'mercedes',
        name: 'Mercedes-Benz',
        description: 'The Best or Nothing - Luxury and Performance',
        logo: 'images/logo.png',
        models: 1,
        founded: 1926,
        color: 'brand-mercedes'
      }
    ];

    // Populate brands grid
    function populateBrands() {
      const brandsGrid = document.getElementById('brandsGrid');
      
      brands.forEach(brand => {
        const brandCard = document.createElement('div');
        brandCard.className = `brand-card ${brand.color}`;
        brandCard.setAttribute('data-brand', brand.id);
        
        brandCard.innerHTML = `
          <div class="brand-logo">
            <img src="${brand.logo}" alt="${brand.name} Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
          </div>
          <h3 class="brand-name">${brand.name}</h3>
          <p class="brand-description">${brand.description}</p>
          <div class="brand-stats">
            <div class="stat">
              <span class="stat-number">${brand.models}</span>
              <span>Models</span>
            </div>
            <div class="stat">
              <span class="stat-number">${brand.founded}</span>
              <span>Founded</span>
            </div>
          </div>
        `;
        
        brandCard.addEventListener('click', () => {
          console.log('Brand card clicked:', brand.id);
          window.pendingBrand = brand.id;
          if (typeof selectBrandWithAuth === 'function') {
            selectBrandWithAuth(brand.id);
          } else {
            selectBrandDirect(brand.id);
          }
        });
        brandsGrid.appendChild(brandCard);
      });
    }

    // Handle brand selection with authentication check
    function selectBrand(brandId) {
      console.log('Brand selected:', brandId);
      window.pendingBrand = brandId;
      
      // Check if user is authenticated
      if (!window.currentUser) {
        const stored = localStorage.getItem('tuning_app_current_user');
        if (stored) {
          try { window.currentUser = JSON.parse(stored); } catch(e) {}
        }
      }

      if (!window.currentUser) {
        console.log('User not authenticated, showing login modal');
        showLoginModal();
        return;
      }
      
      console.log('User authenticated, proceeding with brand selection');
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.style.display = 'flex';
      
      // Simulate loading time
      setTimeout(() => {
        // Store selected brand in localStorage
        localStorage.setItem('selectedBrand', brandId);
        
        // Redirect to brand models page
        window.location.href = `brand_models.html?brand=${brandId}`;
      }, 1000);
    }

    // Alternative function name for compatibility
    function selectBrandWithAuth(brandId) {
      selectBrand(brandId);
    }

    // Fallback function for testing (bypasses auth)
    function selectBrandDirect(brandId) {
      console.log('Direct brand selection (bypassing auth):', brandId);
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.style.display = 'flex';
      
      setTimeout(() => {
        localStorage.setItem('selectedBrand', brandId);
        window.location.href = `brand_models.html?brand=${brandId}`;
      }, 1000);
    }

    // Show login modal
    function showLoginModal() {
      const loginModal = document.getElementById('loginModal');
      loginModal.classList.add('show');
    }

    // Close login modal
    function closeLoginModal() {
      const loginModal = document.getElementById('loginModal');
      loginModal.classList.remove('show');
    }

    // Make functions globally available
    window.selectBrand = selectBrand;
    window.selectBrandWithAuth = selectBrandWithAuth;
    window.selectBrandDirect = selectBrandDirect;
    window.showLoginModal = showLoginModal;
    window.closeLoginModal = closeLoginModal;

    // Initialize page
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Brand selection page loaded');
      populateBrands();
      
      // Debug: Check if functions are available
      console.log('selectBrand function available:', typeof selectBrand);
      console.log('selectBrandWithAuth function available:', typeof selectBrandWithAuth);
      console.log('selectBrandDirect function available:', typeof selectBrandDirect);
      console.log('window.currentUser:', window.currentUser);
    });

    // Add click effects
    document.querySelectorAll('.brand-card').forEach(card => {
      card.addEventListener('click', function() {
        this.style.transform = 'scale(0.95)';
        setTimeout(() => {
          this.style.transform = '';
        }, 150);
      });
    });
  </script>
</body>
</html>
