<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Tuning API Server</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #141416 0%, #1f1f24 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 520px;
            width: 90%;
        }
        h1 {
            color: #ff8c00;
            margin-bottom: 0.5rem;
        }
        .status {
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
            color: #4ecdc4;
            padding: 0.8rem;
            border-radius: 8px;
            margin: 1.2rem 0;
            font-weight: 600;
        }
        .api-info {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.2rem;
            border-radius: 8px;
            margin: 1.2rem 0;
            text-align: left;
            font-size: 0.95rem;
        }
        .api-info p {
            margin: 0.5rem 0;
        }
        .api-info a {
            color: #ff8c00;
            text-decoration: none;
        }
        .api-info a:hover {
            text-decoration: underline;
        }
        .btn {
            background: linear-gradient(45deg, #ff8c00, #ff5500);
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏎️ Car Tuning REST API</h1>
        <div class="status">
            ⚡ Node.js + Express + Mongoose + Cloudinary
        </div>
        <div class="api-info">
            <p><strong>Health Check:</strong> <a href="/api/health" target="_blank">/api/health</a></p>
            <p><strong>Cars Catalog:</strong> <a href="/api/cars" target="_blank">/api/cars</a></p>
            <p><strong>Status:</strong> REST API service is active</p>
        </div>
        <div>
            <a href="/api/health" class="btn">Test Health Endpoint</a>
        </div>
        <p style="opacity: 0.7; font-size: 0.85rem; margin-top: 1.5rem;">Car Tuning 3D Configurator Backend</p>
    </div>
</body>
</html>
